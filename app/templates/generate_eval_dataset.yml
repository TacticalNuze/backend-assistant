defaults: &defaults
  template_id: generate_eval_dataset
  prompt_config:
    source: local
  database: default

task: generate_eval_dataset
<<: *defaults
inputs:
  - client_id
  - project_id
  - language
  - num_queries
  - chunks_per_query
  - output_path
  - query_generation_prompt_key
  - ground_truth_prompt_key
  - embedding_model
  - embedding_provider
  - generate_rag_response
  - rag_prompt_key

steps:
  # Step 1: Retrieve random chunks from ChromaDB
  - step: retrieve_random_chunks
    pipeline_key: retrieve_random_chunks
    inputs:
      - client_id
      - project_id
      - language
      - num_queries
    queue: io_queue

  # Step 2: Generate queries from chunks using prompt-based step
  - step: generate_queries
    pipeline_key: generate_queries_from_chunks
    inputs:
      - retrieve_random_chunks
      - num_queries
      - query_generation_prompt_key
    queue: default_queue

  # Step 3: Search contexts for all queries
  - step: search_contexts
    pipeline_key: search_contexts_for_queries
    inputs:
      - generate_queries
      - client_id
      - project_id
      - language
      - chunks_per_query
      - embedding_model
      - embedding_provider
    queue: io_queue

  # Step 4: Process queries in batch
  # For each query: generate ground truth and optionally RAG response
  # Processes all queries in batches instead of one-by-one
  - step: process_queries
    pipeline_key: process_eval_queries_batch
    inputs:
      - generate_queries
      - search_contexts
      - client_id
      - project_id
      - language
      - chunks_per_query
      - embedding_model
      - embedding_provider
      - ground_truth_prompt_key
      - generate_rag_response
      - rag_prompt_key
    queue: io_queue

  # Step 5: Combine processed queries into final dataset
  - step: combine_dataset
    pipeline_key: combine_eval_dataset
    inputs:
      - process_queries
    queue: default_queue

  # Step 6: Save dataset to JSON file
  - step: save_dataset_to_file
    pipeline_key: save_eval_dataset_to_file
    inputs:
      - combine_dataset
      - output_path
      - client_id
      - project_id
      - language
      - chunks_per_query
    queue: io_queue

  # Step 7: Save dataset to Langfuse
  - step: save_dataset_to_langfuse
    pipeline_key: save_eval_dataset_to_langfuse
    inputs:
      - save_dataset_to_file
      - client_id
      - project_id
      - language
      - retrieve_random_chunks
    queue: io_queue

  # Final step: Pass through the results
  - step: pass_through
    pipeline_key: PassThrough
    section_id: eval_dataset_result
    inputs:
      - save_dataset_to_langfuse
    queue: default_queue